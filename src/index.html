<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rook</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- STARTUP: the book draws itself, its ribbon drops in and lines are written while the vault loads; then the screen turns like a page. -->
<div class="splash" id="splash" aria-hidden="true">
  <div class="splash-mark">
    <svg class="splash-book" viewBox="0 0 32 32">
      <rect class="sb-cover" x="4.5" y="3" width="23" height="26" rx="2.5" pathLength="100"/>
      <path class="sb-ribbon" d="M19.24 2.1h5.06v12.61l-2.53-2.3-2.53 2.3z"/>
      <path class="sb-line" d="M9 20.6h8.97" pathLength="100"/>
      <path class="sb-line two" d="M9 24.4h5.52" pathLength="100"/>
    </svg>
    <span class="splash-word"><span>r</span><span>o</span><span>o</span><span>k</span></span>
  </div>
</div>

<div class="app" id="app">
  <header class="topbar">
    <button class="brand" id="go-home" aria-label="Home"><span id="brand-mark"></span><span class="word">rook</span></button>
    <nav class="topnav" id="topnav" aria-label="Sections"></nav>
    <label class="search-box" id="search-box">
      <span id="search-icon"></span>
      <input type="search" id="search-input" placeholder="Search" aria-label="Search notes and chats" autocomplete="off" spellcheck="false">
    </label>
    <div class="topbar-tools" id="topbar-tools"></div>
    <div class="window-controls">
      <button id="win-min" aria-label="Minimize" title="Minimize"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 5.5h10"></path></svg></button>
      <button id="win-max" aria-label="Maximize" title="Maximize"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><rect x=".5" y=".5" width="9" height="9"></rect></svg></button>
      <button id="win-close" class="close" aria-label="Close" title="Close"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1"><path d="M0 0l10 10M10 0L0 10"></path></svg></button>
    </div>
  </header>

  <!-- Only the pages scroll; the top bar and the ask bar stay put. -->
  <div class="scroller" id="scroller">
    <main class="view view-home" id="view-home"></main>
    <main class="view view-chat" id="view-chat"></main>
    <main class="view view-notes" id="view-notes">
      <aside class="tree"><div class="tree-tools" id="tree-tools"></div><div class="tree-list" id="tree-list"></div></aside>
      <section class="reader" id="reader"></section>
      <section class="map-pane hidden" id="map-pane"></section>
    </main>
    <main class="view view-list" id="view-search"></main>
    <main class="view view-list" id="view-settings"></main>
  </div>

  <footer class="askbar" id="askbar">
    <div class="ask-seek"></div>
    <div class="ask-row">
      <div class="ask-field">
        <div id="ask-ctx-slot"></div>
        <div class="ask-line">
          <label class="sr" for="ask">Message</label>
          <textarea id="ask" rows="1" placeholder="Ask about your vault, or tell Rook what to write…"></textarea>
          <span id="send-slot"></span>
        </div>
      </div>
    </div>
    <p class="ask-hint" id="ask-hint"></p>
  </footer>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- COMPACT: when the window shrinks to a strip (Ctrl M), only this shows. -->
<div class="compact" id="compact">
  <span id="compact-mark"></span>
  <div class="compact-meta"><span class="compact-status" id="compact-status" role="status">Quick capture</span><input type="text" id="compact-input" placeholder="Capture a note or ask…" aria-label="Message" autocomplete="off"></div>
  <span id="compact-send"></span>
  <span id="compact-expand"></span>
  <div class="compact-seek"></div>
</div>

<script src="icons.js"></script>
<script src="markdown.js"></script>
<script src="graph.js"></script>
<script src="renderer.js"></script>
</body>
</html>
