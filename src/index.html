<!doctype html>
<html><head><meta charset="utf-8"><title>Vault Assistant</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
:root{--bg:#14161a;--panel:#1c1f25;--text:#e6e8eb;--mute:#8b93a1;--accent:#7c9cff;--user:#26304d}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--panel:#fff;--text:#1b1f24;--mute:#667085;--accent:#3b5bdb;--user:#e3e9ff}}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #0003;color:var(--mute)}
header b{color:var(--text)}button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
button.ghost{background:transparent;color:var(--mute);border:1px solid #8883}
#log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:80%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;background:var(--panel)}
.m.user{align-self:flex-end;background:var(--user)}.tool{font-size:12px;color:var(--mute);font-family:ui-monospace,monospace}
.err{color:#ff7b7b}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #0003}
textarea{flex:1;resize:none;height:56px;padding:10px;border-radius:8px;border:1px solid #8883;background:var(--panel);color:var(--text);font:inherit}
dialog{background:var(--panel);color:var(--text);border:1px solid #8883;border-radius:12px;width:520px}
dialog label{display:block;margin:10px 0 4px;color:var(--mute)}dialog input{width:100%;padding:8px;border-radius:6px;border:1px solid #8883;background:var(--bg);color:var(--text)}
</style></head><body>
<header><span><b>Vault Assistant</b> · read-only except your vault</span><span><button class="ghost" id="new">New chat</button> <button class="ghost" id="cfg">Settings</button></span></header>
<div id="log"></div>
<form id="f"><textarea id="p" placeholder="Take a note, add an event, ask for observations… (Enter to send, Shift+Enter for newline)"></textarea><button id="go">Send</button></form>
<dialog id="d"><form method="dialog"><h3>Settings</h3>
<label>Vault path (Windows)</label><input id="vault"><label>Claude CLI path (inside WSL)</label><input id="claude">
<p style="text-align:right"><button value="x">Save</button></p></form></dialog>
<script src="renderer.js"></script></body></html>
